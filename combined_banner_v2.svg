      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.08;0.85;1" dur="138.9s" begin="-94.0s" repeatCount="indefinite"/>
    </circle>
    <circle cx="0" cy="0" r="4.5" fill="#847cca" opacity="0">
