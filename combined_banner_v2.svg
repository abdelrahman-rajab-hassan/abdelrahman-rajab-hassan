  <!-- ── NAME ── -->
  <text x="400" y="100" text-anchor="middle" class="name-text">ABDELRAHMAN HASSAN</text>

  <!-- Thin divider -->
  <line x1="120" y1="128" x2="680" y2="128" class="divider"/>
  <circle cx="120" cy="128" r="2.5" class="dot dot1"/>
  <circle cx="680" cy="128" r="2.5" class="dot dot2"/>

  <!-- ── TAGLINE ── -->
  <circle cx="55" cy="195" r="4" class="dot dot1"/>
  <line x1="65" y1="195" x2="110" y2="195" class="line-accent"/>
  <circle cx="745" cy="195" r="4" class="dot dot2"/>
  <line x1="690" y1="195" x2="735" y2="195" class="line-accent"/>

  <text x="400" y="190" text-anchor="middle" class="tagline-main">Building Models That Learn.</text>
  <text x="400" y="222" text-anchor="middle" class="tagline-main">Building Solutions That Last.</text>

  <!-- Subtitle row -->
