<svg width="100%" viewBox="0 0 800 300" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>ABDELRAHMAN HASSAN - ML Specialist Banner</title>

  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700&amp;family=Fira+Code:wght@400;500&amp;display=swap');

      .name-text {
        font-family: 'Orbitron', sans-serif;
        font-size: 34px;
        font-weight: 700;
        fill: #6B7280;
        letter-spacing: 4px;
      }
      .tagline-main {
        font-family: 'Fira Code', monospace;
        font-size: 22px;
        font-weight: 500;
        fill: #7F77DD;
      }
      .sub-text {
        font-family: 'Fira Code', monospace;
        font-size: 13px;
        fill: #888780;
      }
      .line-accent {
        stroke: #AFA9EC;
        stroke-width: 1;
        opacity: 0.35;
      }
      .dot {
        fill: #AFA9EC;
        animation: pulse 2.5s ease-in-out infinite;
      }
      .dot1 { animation-delay: 0s; }
      .dot2 { animation-delay: 0.4s; }
      .dot3 { animation-delay: 0.8s; }
      @keyframes pulse {
        0%, 100% { opacity: 0.3; }
        50% { opacity: 1; }
      }
      .divider {
        stroke: #AFA9EC;
        stroke-width: 0.5;
        opacity: 0.25;
      }
    </style>

    <linearGradient id="hFade" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="800" y2="0">
      <stop offset="0%"   stop-color="black"/>
      <stop offset="9%"   stop-color="white"/>
      <stop offset="91%"  stop-color="white"/>
      <stop offset="100%" stop-color="black"/>
    </linearGradient>
    <linearGradient id="vFade" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="300">
      <stop offset="0%"   stop-color="black"/>
      <stop offset="10%"  stop-color="white"/>
      <stop offset="90%"  stop-color="white"/>
      <stop offset="100%" stop-color="black"/>
    </linearGradient>
    <mask id="edgeMask" maskUnits="userSpaceOnUse">
      <rect x="0" y="0" width="800" height="300" fill="url(#hFade)"/>
      <rect x="0" y="0" width="800" height="300" fill="url(#vFade)" style="mix-blend-mode:multiply"/>
    </mask>
  </defs>

  <!-- Transparent background version (no fill rect) -->

