<svg viewBox="0 0 800 160" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500&amp;display=swap');
      .tagline-main {
        font-family: 'Fira Code', monospace;
        font-size: 24px;
        font-weight: 500;
        fill: #7F77DD;
      }
      .cursor {
        fill: #7F77DD;
        animation: blink 1s step-end infinite;
      }
      @keyframes blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }
      .dot {
        animation: pulse 2.5s ease-in-out infinite;
      }
      .dot1 { animation-delay: 0s; }
      .dot2 { animation-delay: 0.4s; }
      .dot3 { animation-delay: 0.8s; }
      @keyframes pulse {
        0%, 100% { opacity: 0.3; r: 3px; }
        50% { opacity: 1; r: 5px; }
      }
      .line-accent {
        stroke: #AFA9EC;
        stroke-width: 1;
        opacity: 0.4;
      }
      .sub-text {
        font-family: 'Fira Code', monospace;
        font-size: 13px;
        fill: #888780;
      }
      .bracket {
        font-family: 'Fira Code', monospace;
        font-size: 22px;
        font-weight: 400;
        fill: #AFA9EC;
        opacity: 0.6;
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="800" height="160" fill="#f5f4f0" rx="12"/>

  <!-- Decorative bracket top center -->
  <text x="400" y="30" text-anchor="middle" class="bracket">[</text>

  <!-- Left decorative dots and lines -->
  <circle cx="60" cy="80" r="4" fill="#AFA9EC" class="dot dot1"/>
  <line x1="70" y1="80" x2="110" y2="80" class="line-accent"/>

  <!-- Right decorative dots and lines -->
  <circle cx="740" cy="80" r="4" fill="#AFA9EC" class="dot dot2"/>
  <line x1="690" y1="80" x2="730" y2="80" class="line-accent"/>

  <!-- Vertical cursor line right side -->
  <rect x="720" y="62" width="2" height="24" rx="1" fill="#7F77DD" class="cursor"/>

  <!-- Main text lines -->
  <text x="400" y="78" text-anchor="middle" class="tagline-main">Building Models That Learn.</text>
  <text x="400" y="108" text-anchor="middle" class="tagline-main">Building Solutions That Last.</text>

  <!-- Bottom decorative line and subtitle -->
  <line x1="270" y1="132" x2="330" y2="132" class="line-accent"/>
  <circle cx="258" cy="132" r="3" fill="#AFA9EC" class="dot dot3"/>
  <text x="400" y="136" text-anchor="middle" class="sub-text">— Machine Learning Specialist</text>
  <line x1="470" y1="132" x2="530" y2="132" class="line-accent"/>
  <circle cx="542" cy="132" r="3" fill="#AFA9EC" class="dot dot1"/>

</svg>
